name: urban_tanker_app
description: Native Urban Tanker mobile application for customer, vendor, dispatcher, and admin workspaces.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  socket_io_client: ^3.0.2
  cupertino_icons: ^1.0.8
  flex_color_scheme: ^8.3.0
  flutter_riverpod: ^2.6.1
  onesignal_flutter: ^5.3.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
