name: urban_tanker_app
description: Native Urban Tanker mobile application for customer, vendor, dispatcher, and admin workspaces.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  connectivity_plus: ^7.3.1
  http: ^1.3.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  socket_io_client: ^3.0.2
  cupertino_icons: ^2.0.0
  flex_color_scheme: ^8.4.0
  flutter_riverpod: ^3.4.3
  onesignal_flutter: ^5.3.4
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  file_picker: ^13.3.0
  image_picker: ^1.2.4
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
